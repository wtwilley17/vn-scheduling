components:
- components:
  - layout_properties: {grid_position: 'YCLKTR,ZFQCVB'}
    name: label_2
    properties: {text: HOW TO USE VN SCHEDULING}
    type: Label
  - components:
    - layout_properties: {grid_position: 'BXMHEV,OOEFHT'}
      name: label_3
      properties: {bold: true, font_size: 20, text: 1. Please use this query to get agent available and agent leave request for next month}
      type: Label
    - layout_properties: {grid_position: 'VNGJPM,SVQKKL'}
      name: label_4
      properties: {text: Agent List}
      type: Label
    - layout_properties: {grid_position: 'TUXJDX,PDOOOF'}
      name: text_area_1
      properties:
        auto_expand: true
        enabled: false
        text: "WITH leave_request AS (\n    SELECT \n        date(date_leave) AS date_leave, \n        name, \n        reason\n    FROM (\n        SELECT *,\n               generate_series(start_date, end_date, '1 day'::interval) AS date_leave\n        FROM ca_vn_agent_leave cval\n        WHERE start_date BETWEEN date_trunc('month', (current_date + INTERVAL '1 month')) \n                            AND date_trunc('month', (current_date + INTERVAL '1 month') + INTERVAL '1 month') - INTERVAL '1 day'\n        ORDER BY start_date\n    ) AS subquery1\n),\n\nleave_schedule AS (\n    SELECT \n        date_leave, \n        name, \n        type AS reason\n    FROM (\n        SELECT \n            date AS date_leave, \n            agent AS name,\n            agent_email AS email,\n            status AS type,\n            EXTRACT(DAY FROM date) AS day, \n            EXTRACT(MONTH FROM date) AS month,\n            EXTRACT(YEAR FROM date) AS year,\n            ROW_NUMBER() OVER (PARTITION BY date, agent, channel ORDER BY status) AS row_num\n        FROM vn_ca_agent_schedule_edit AS schedule\n        WHERE date BETWEEN ((date_trunc('MONTH', CURRENT_DATE) + INTERVAL '1 MONTH - 1 day')::DATE - INTERVAL '9 days') \n                        AND (date_trunc('MONTH', CURRENT_DATE) + INTERVAL '1 MONTH - 1 day')::DATE \n          AND status IN ('X', 'AL', 'RO')\n    ) AS subquery2\n    WHERE row_num = 1\n)\n\nSELECT \n    date_leave, \n    name,\n    CASE \n        WHEN reason = 'X' THEN 'Request Off' \n        --WHEN reason = 'DO' THEN 'Request Off' \n        WHEN reason = 'AL' THEN 'Annual Leave' \n        ELSE reason \n    END AS reason\nFROM (\n    SELECT *\n    FROM leave_schedule\n\n    UNION ALL\n\n    SELECT *\n    FROM leave_request\n) AS combined_results;"
      type: TextArea
    - layout_properties: {grid_position: 'ADBMLI,PPRPPY'}
      name: label_5
      properties: {text: Agent Leave Request}
      type: Label
    - layout_properties: {grid_position: 'KGCJGA,EYTWRM'}
      name: text_area_2
      properties: {enabled: false}
      type: TextArea
    - layout_properties: {grid_position: 'NIFJYE,MQFZQQ'}
      name: label_6
      properties:
        bold: true
        font_size: 20
        spacing_above: none
        spacing_below: none
        text: |
          2. Please download the query into .CSV files
          3. Upload the CSV into respective files uploader
          4. Input the Public Holiday Date for Next Month
          5. Click Create Schedule
          6. (Optional) You can download the result into .CSV format
      type: Label
    layout_properties: {grid_position: 'LPDEFA,JFXXEY'}
    name: card_1
    properties: {role: card}
    type: ColumnPanel
  layout_properties: {slot: default}
  name: content_panel
  properties: {}
  type: ColumnPanel
- layout_properties: {slot: title}
  name: label_1
  properties: {font_size: 22, text: vn sCHEDULING}
  type: Label
- event_bindings: {click: link_1_click}
  layout_properties: {slot: sidebar}
  name: link_1
  properties: {bold: true, text: VNCA}
  type: Link
- event_bindings: {click: link_2_click}
  layout_properties: {slot: sidebar}
  name: link_2
  properties: {bold: true, text: GUIDE}
  type: Link
