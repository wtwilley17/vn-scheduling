      type: Label
    - layout_properties: {grid_position: 'TUXJDX,PDOOOF'}
      name: text_area_1
      properties:
        auto_expand: true
        enabled: false
        text: "with yy as (\n  select *\n     , date(creation_date) as date1\n     , case when date(lag(date_add(creation_date, interval -1 day), 1) over(partition by agent_id order by creation_date desc)) is null\n              and date(creation_date) <= date(current_date('Asia/Jakarta')) then date(current_date('Asia/Jakarta'))\n            when date(lag(date_add(creation_date, interval -1 day), 1) over (partition by agent_id order by creation_date desc)) is null\n              and date(creation_date) > date(current_date('Asia/Jakarta')) then date(current_date('Asia/Jakarta'))\n            else date(lag(date_add(creation_date, interval -1 day), 1) over (partition by agent_id order by creation_date desc)) end as date2\n     , row_number() over (partition by agent_id order by creation_date desc) as rank\nfrom appsheet.ca_vn_agent_movement\norder by 1\n)\n\nselect date_leave,name,reason from (\n  select u.* except(rw) from(\n  select date_leave,\n        name,\n        email,\n        case when reason ='X' then 'Request Off' \n              when reason='AL' then 'Annual Leave'\n              else reason end as reason,\n        day,\n        month,\n        year,\n        row_number() over (partition by date_leave, name order by length(reason) desc) as rw\n  from(\n\n  select h.* from (        \n          select distinct * from(\n          select \n          date_leave,\n          INITCAP(name) as name,\n          email,\n          reason,\n          extract(day from date_leave) as day, \n                      extract(month from date_leave) as month,\n                      extract(year from date_leave) as year\n          from(\n          select * except(range_date)\n          from (select *,\n          generate_date_array(start_date,end_date, interval 1 day) as range_date\n          from (select * from appsheet.ca_vn_agent_leave\n            where date(start_date) BETWEEN date_trunc(date_add(current_date(), interval 1 month), month) \n          and last_day(date_add(current_date(), interval 1 month), month)))\n          cross join unnest(range_date) as date_leave)\n          union all\n          select * from(\n          select * except(row) from\n          (select date as date_leave, \n          agent name,\n          agent_email email,\n          status as type,\n          extract(day from date) as day, \n                      extract(month from date) as month,\n                      extract(year from date) as year,\n          row_number() over (partition by date, agent, channel order by status) as row\n          from appsheet.vn_ca_agent_schedule_edit\n          where date(date) between last_day(date_add(current_date(), interval 0 month), month) - 9\n          and last_day(date_add(current_date(), interval 0 month), month) and (status in ('X','AL','RO')))\n          where row=1)\n          )\n                  where name in ((select distinct agent\n          from(\n  select *,\n      lead(start_date) over (partition by email order by date) as st_dt_1,\n      lead(last_date) over (partition by email order by date) as lt_dt_1,\n    row_number() over (partition by email order by update_at) as rw\n  from (\n      select *, date_add(last_date, interval 1 day) as start_date, \n      last_day(date_add(current_date(), interval 1 month), month) as end_date,\n      \n  from(\n  select creation_date as date, email, agent_id as agent, role, status, team_type, update_at,\n      case when last_date between date_trunc(date_add(current_date(), interval 1 month), month) \n    and last_day(date_add(current_date(), interval 1 month), month) then last_date\n      when last_date is null then last_day(date_add(current_date(), interval 1 month), month) \n      when last_date is not null then last_date end as last_date\n      from(\n  select *, lead(creation_date) over (partition by email order by date1) - 1 as last_date \n  from yy-- views.ca_ops_agent_team_view\n      )\n  )\n  where last_date between date_trunc(date_add(current_date(), interval 1 month), month) \n    and last_day(date_add(current_date(), interval 1 month), month) -- and skill='Premium' \n    and  status <>'Left' and agent not in ('An Le', 'Khanh Nguyen')\n    and \n    update_at is not null )\n          )\n    where rw=1))\n          order by 2,1 \n  ) h\n  left join (\n    select *  from (select * except(range_date), \n          from (select *,\n          generate_date_array(start_date,end_date, interval 1 day) as range_date\n          from (select * from(\n        select creation_date as start_date, case when end_date is null then last_day(date_add(current_date(), interval 1 month), month)  else date_sub(end_date, interval 1 day) end as end_date, agent_id, team_type \n      from \n  (select *,\n  row_number() over (partition by email order by creation_date) as row,\n  lead(creation_date) over (partition by email order by creation_date) as end_date,\n  lead(team_type) over (partition by email order by creation_date) as new_team_type, \n  --lead(child_team) over (partition by email order by creation_date) as new_child_team \n      from yy)\n      where status <> 'Left')\n      )\n        )\n          cross join unnest(range_date) as date\n          order by start_date)\n\n  ) v\n  on h.date_leave = v.date and h.name = v.agent_id\n\n  union all \n  select * from (select * from (\n  (select \n          date_leave,\n          INITCAP(name) as name,\n          email,\n          --INITCAP(team_type) as team_type,\n          --INITCAP(child_team) as child_team,\n          'NA' as type,\n          extract(day from date_leave) as day, \n                      extract(month from date_leave) as month,\n                      extract(year from date_leave) as year,\n          from(\n          select * except(range_date)\n          from (\n            select *,\n            generate_date_array(start_date,end_date, interval 1 day) as range_date\n          from (\n              select * from (\n    (select date,\n          email,\n          agent as name,\n          role,\n          status,\n          team_type,\n          update_at,\n          case when lt_dt_1 is not null then lt_dt_1 else last_date end as last_date,\n          case when st_dt_1 is not null then st_dt_1 else start_date end as start_date,\n          end_date\n          from(\n\n  select *,\n      lead(start_date) over (partition by email,team_type order by date) as st_dt_1,\n      lead(last_date) over (partition by email,team_type  order by date) as lt_dt_1,\n    row_number() over (partition by email,team_type order by update_at) as rw\n  from (\n      select *, date_add(last_date, interval 1 day) as start_date, \n      last_day(date_add(current_date(), interval 1 month), month) as end_date,\n      \n  from(\n  select creation_date as date, email, agent_id as agent, role, status,team_type, update_at,\n  -- creation_date, email, agent_id, role, status, skill, channel, upload_time,\n      case when last_date between date_trunc(date_add(current_date(), interval 1 month), month) \n    and last_day(date_add(current_date(), interval 1 month), month) then last_date\n      when last_date is null then last_day(date_add(current_date(), interval 1 month), month) \n      when last_date is not null then last_date end as last_date\n      from(\n  select *, lead(creation_date) over (partition by email order by date1) - 1 as last_date \n  from yy--views.ca_ops_agent_team_view\n      )\n  )\n  where last_date between date_trunc(date_add(current_date(), interval 1 month), month) \n    and last_day(date_add(current_date(), interval 1 month), month) --and skill='Premium' \n    and  status <>'Left' and agent not in ('An Le', 'Khanh Nguyen')\n    and \n    update_at is not null )\n          )\n    where rw=1)\n    )\n            where date(start_date) BETWEEN date_trunc(date_add(current_date(), interval 1 month), month) \n          and last_day(date_add(current_date(), interval 1 month), month)))\n          cross join unnest(range_date) as date_leave)\n      )\n  union all \n  select * from \n  (-- before\n\n  select \n          date_leave,\n          INITCAP(name) as name,\n          email,\n          --INITCAP(team_type) as team_type,\n          --INITCAP(child_team) as child_team,\n          'NA' as type,\n          extract(day from date_leave) as day, \n                      extract(month from date_leave) as month,\n                      extract(year from date_leave) as year,\n          from(\n          select * except(range_date)\n          from (\n            select *,\n            generate_date_array(start_date,end_date, interval 1 day) as range_date\n          from (\n              select * from (\n    (select date,\n          email,\n          agent_id name,\n          role,\n          status,\n          team_type,\n          update_at,\n          case when lt_dt_1 is not null then lt_dt_1 else last_date end as last_date,\n          case when st_dt_1 is not null then st_dt_1 else start_date end as start_date,\n          end_date\n          from(\n\n  select *,\n      lead(start_date) over (partition by email,team_type order by date) as st_dt_1,\n      lead(last_date) over (partition by email,team_type order by date) as lt_dt_1,\n    row_number() over (partition by email,team_type order by update_at) as rw\n  from (\n      select *, \n      date_trunc(date_add(current_date(), interval 1 month), month) as start_date\n                    ,date_add(date, interval -1 day) as end_date \n      \n  from(\n  select creation_date date, email, agent_id, role, status, team_type, update_at,\n      case when last_date between date_trunc(date_add(current_date(), interval 1 month), month) \n    and last_day(date_add(current_date(), interval 1 month), month) then last_date\n      when last_date is null then last_day(date_add(current_date(), interval 1 month), month) \n      when last_date is not null then last_date end as last_date\n      from(\n  select *, lead(creation_date) over (partition by email order by date1) - 1 as last_date \n  from yy\n      )\n  )\n  where last_date between date_trunc(date_add(current_date(), interval 1 month), month) \n    and last_day(date_add(current_date(), interval 1 month), month) \n    and status <>'Left' and  agent_id not in ('An Le', 'Khanh Nguyen')\n    and \n    update_at is not null )\n          )\n    where rw=1)\n    )\n            where date(start_date) BETWEEN date_trunc(date_add(current_date(), interval 1 month), month) \n          and last_day(date_add(current_date(), interval 1 month), month)))\n          cross join unnest(range_date) as date_leave)\n  )\n        )\n      )\n    )\n  ) u)\norder by 1"
      type: TextArea
    - layout_properties: {grid_position: 'ADBMLI,PPRPPY'}
      name: label_5
      properties: {text: Agent Leave Request}
      type: Label
    - layout_properties: {grid_position: 'KGCJGA,EYTWRM'}
      name: text_area_2
      properties:
        auto_expand: true
        enabled: false
        text: "select agent_id,role\n        ,case when abs(date_diff(date_trunc(end_date,month),date,day))<=31 then 'nw' else 'old' end as stat\n        from(\n\nselect *,\n    lead(start_date) over (partition by email,team_type order by date) as st_dt_1,\n    lead(last_date) over (partition by email,team_type order by date) as lt_dt_1,\n   row_number() over (partition by email,team_type order by update_at) as rw\nfrom (\n    select *, date_add(last_date, interval 1 day) as start_date, \n    last_day(date_add(current_date(), interval 1 month), month) as end_date,\n     \n from(\nselect creation_date date, email, agent_id, role, status, team_type, update_at,\n    case when last_date between date_trunc(date_add(current_date(), interval 1 month), month) \n  and last_day(date_add(current_date(), interval 1 month), month) then last_date\n    when last_date is null then last_day(date_add(current_date(), interval 1 month), month) \n    when last_date is not null then last_date end as last_date\n    from(\nselect *, lead(creation_date) over (partition by email order by date1) - 1 as last_date \nfrom (  select *\n     , date(creation_date) as date1\n     , case when date(lag(date_add(creation_date, interval -1 day), 1) over(partition by agent_id order by creation_date desc)) is null\n              and date(creation_date) <= date(current_date('Asia/Jakarta')) then date(current_date('Asia/Jakarta'))\n            when date(lag(date_add(creation_date, interval -1 day), 1) over (partition by agent_id order by creation_date desc)) is null\n              and date(creation_date) > date(current_date('Asia/Jakarta')) then date(current_date('Asia/Jakarta'))\n            else date(lag(date_add(creation_date, interval -1 day), 1) over (partition by agent_id order by creation_date desc)) end as date2\n     , row_number() over (partition by agent_id order by creation_date desc) as rank\nfrom appsheet.ca_vn_agent_movement\norder by 1)\n    )\n)\nwhere last_date between date_trunc(date_add(current_date(), interval 1 month), month) \n  and last_day(date_add(current_date(), interval 1 month), month)\n  and status <>'Left' and role = 'Agent'\n  -- agent_id not in ('An Le', 'Khanh Nguyen')\n  and \n  update_at is not null )\n        ) \n  where rw=1"
      type: TextArea
    - layout_properties: {grid_position: 'NIFJYE,MQFZQQ'}
      name: label_6
      properties:
        bold: true
        font_size: 20
        spacing_above: none
        spacing_below: none
        text: |
          2. Please download the query into .CSV files
          3. Upload the CSV into respective files uploader
          4. Input the Public Holiday Date for Next Month
          5. Click Create Schedule
          6. (Optional) You can download the result into .CSV format
      type: Label
    layout_properties: {grid_position: 'LPDEFA,JFXXEY'}
    name: card_1
    properties: {role: card}
    type: ColumnPanel
  layout_properties: {slot: default}
  name: content_panel
  properties: {}
  type: ColumnPanel
